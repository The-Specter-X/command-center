name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'debian:testing']
    container: ${{ matrix.image }}
    steps:
      - name: Dependencies
        timeout-minutes: 8
        run: |
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y build-essential pkg-config libnftables-dev libjson-c-dev libsystemd-dev libnl-route-3-dev libcurl4-openssl-dev python3 debhelper git ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Strict build and offline tests
        run: python3 scripts/record_check.py artifacts/offline-tests.log make -j2 all check
      - name: Bounded-load evidence
        run: |
          make build/test-load
          ./build/test-load > artifacts/load.json
          ./build/test-kernel > artifacts/kernel-query.json
      - name: Build Debian packages
        run: dpkg-buildpackage -us -uc -b
      - name: Stage install and package contents
        run: |
          dpkg-deb --contents ../command-center_2.1.0_*.deb
          dpkg-deb --contents ../command-center-shortcut_2.1.0_all.deb
          mkdir -p artifacts
          cp ../*.deb ../*.buildinfo ../*.changes artifacts/
          python3 scripts/release_manifest.py artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: packages-${{ strategy.job-index }}
          path: |
            artifacts/*
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Dependencies
        timeout-minutes: 8
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y build-essential clang pkg-config libnftables-dev libjson-c-dev libsystemd-dev libnl-route-3-dev libcurl4-openssl-dev python3
      - name: Sanitizers including leak detection
        run: make CC=clang sanitize
      - name: GCC analyzer
        run: make analyze
      - name: Clang build
        run: make clean && make CC=clang -j2 all check
      - name: Sanitized coverage-guided parser fuzzing
        run: python3 scripts/record_check.py artifacts/fuzz.log make fuzz-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parser-fuzz-evidence
          path: artifacts/*
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Dependencies
        timeout-minutes: 8
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y build-essential pkg-config libnftables-dev libjson-c-dev libsystemd-dev libnl-route-3-dev libcurl4-openssl-dev python3 iproute2 nftables
      - run: make -j2
      - name: Private namespace packet tests
        run: python3 scripts/record_check.py artifacts/native.log sudo python3 tests/test_live.py ./build/command-center
      - name: Read-only networking reports
        run: python3 scripts/record_check.py artifacts/network.log python3 tests/test_network.py ./build/command-center
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-evidence
          path: artifacts/*
  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build disposable Debian systemd image
        run: docker build -f tests/systemd/Dockerfile -t command-center-systemd .
      - name: Start isolated systemd
        run: docker run -d --name command-center-test --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock --tmpfs /tmp command-center-systemd
      - name: Verify actual services and SSH events
        run: python3 scripts/record_check.py artifacts/systemd.log docker exec command-center-test python3 /src/tests/systemd/test_systemd.py
      - name: Service diagnostics
        if: always()
        run: |
          docker exec command-center-test journalctl --no-pager -n 250 || true
          docker exec command-center-test journalctl --no-pager -u command-center-guard.service -n 100 || true
          docker exec command-center-test cat /run/command-center/guard-health.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: systemd-package-evidence
          path: artifacts/*
      - name: Remove disposable container
        if: always()
        run: docker rm -f command-center-test || true
