name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'debian:testing']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Dependencies
        timeout-minutes: 8
        run: |
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y build-essential pkg-config libnftables-dev libjson-c-dev libsystemd-dev libnl-route-3-dev libcurl4-openssl-dev python3 debhelper
      - name: Strict build and offline tests
        run: make -j2 all check
      - name: Build Debian packages
        run: dpkg-buildpackage -us -uc -b
      - name: Stage install and package contents
        run: |
          dpkg-deb --contents ../command-center_2.0.0_*.deb
          dpkg-deb --contents ../command-center-shortcut_2.0.0_all.deb
          mkdir -p artifacts
          cp ../*.deb ../*.buildinfo ../*.changes artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ strategy.job-index }}
          path: |
            artifacts/*.deb
            artifacts/*.buildinfo
            artifacts/*.changes
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y build-essential clang pkg-config libnftables-dev libjson-c-dev libsystemd-dev libnl-route-3-dev libcurl4-openssl-dev python3
      - name: Sanitizers including leak detection
        run: make CC=clang sanitize
      - name: GCC analyzer
        run: make analyze
      - name: Clang build
        run: make clean && make CC=clang -j2 all check
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y build-essential pkg-config libnftables-dev libjson-c-dev libsystemd-dev libnl-route-3-dev libcurl4-openssl-dev python3 iproute2 nftables
      - run: make -j2
      - name: Private namespace packet tests
        run: sudo python3 tests/test_live.py ./build/command-center
      - name: Read-only networking reports
        run: python3 tests/test_network.py ./build/command-center
  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build disposable Debian systemd image
        run: docker build -f tests/systemd/Dockerfile -t command-center-systemd .
      - name: Start isolated systemd
        run: docker run -d --name command-center-test --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock --tmpfs /tmp command-center-systemd
      - name: Verify actual services and SSH events
        run: docker exec command-center-test python3 /src/tests/systemd/test_systemd.py
      - name: Service diagnostics
        if: always()
        run: docker exec command-center-test journalctl --no-pager -n 250 || true
      - name: Remove disposable container
        if: always()
        run: docker rm -f command-center-test || true
